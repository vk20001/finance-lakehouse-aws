models:
  - name: stg_equities_stooq
    description: Staging model for Stooq equities price history with typed date normalization and quality guardrails.

    columns:

      - name: symbol
        description: Equity ticker symbol
        tests:
          - not_null

      - name: market_date
        description: Canonical normalized trade date
        tests:
          - not_null

      - name: trade_year
        description: Derived calendar year from normalized date
        tests:
          - not_null

      - name: trade_month
        description: Derived calendar month from normalized date
        tests:
          - not_null

      - name: trade_day
        description: Derived calendar day from normalized date
        tests:
          - not_null

