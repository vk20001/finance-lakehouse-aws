name: Finance Lakehouse dbt CI

on:
  workflow_dispatch:
    inputs:
      domain:
        description: "Data domain to run (fred or stooq)"
        required: true
        type: choice
        options:
          - fred
          - stooq

jobs:
  dbt-run:
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt
        run: |
          pip install --upgrade pip
          pip install dbt-athena-community==1.9.5

      - name: Install dbt packages
        working-directory: dbt/finance_dbt
        run: dbt deps

      - name: Create dbt profiles dir
        run: mkdir -p ~/.dbt

      - name: Write dbt profile
        run: cp dbt/finance_dbt/profiles_ci.yml ~/.dbt/profiles.yml

      - name: Debug dbt environment
        run: |
          echo "DBT_PROFILES_DIR=$DBT_PROFILES_DIR"
          env | grep DBT || true
          ls -la /home/runner || true
          ls -la ~/.dbt || true

      - name: Run dbt models
        working-directory: dbt/finance_dbt
        run: dbt run --select tag:${{ github.event.inputs.domain }} --full-refresh

      - name: Run dbt tests
        working-directory: dbt/finance_dbt
        run: dbt test --select tag:${{ github.event.inputs.domain }}

