name: Finance Lakehouse dbt CI

on:
  schedule:
    # Ingestion at 06:00 (FRED) & 06:05 (STOOQ)
    # Buffer added → dbt runs at 06:30 UTC
    - cron: "30 6 * * *"
  workflow_dispatch:

jobs:
  dbt:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt
        run: |
          pip install --upgrade pip
          pip install dbt-athena-community==1.9.5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # REQUIRED FOR ATHENA STABILITY
      - name: Clean Athena CTAS temp data
        run: |
          aws s3 rm s3://finance-lake-query-vk1911eu/tables/ --recursive || true

      - name: Install dbt packages
        working-directory: dbt/finance_dbt
        run: dbt deps

      - name: dbt debug
        working-directory: dbt/finance_dbt
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ATHENA_S3_QUERY_RESULTS: ${{ secrets.ATHENA_S3_QUERY_RESULTS }}
        run: dbt debug

      - name: dbt run (ALL MODELS)
        working-directory: dbt/finance_dbt
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ATHENA_S3_QUERY_RESULTS: ${{ secrets.ATHENA_S3_QUERY_RESULTS }}
        run: dbt run

      - name: dbt test
        working-directory: dbt/finance_dbt
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ATHENA_S3_QUERY_RESULTS: ${{ secrets.ATHENA_S3_QUERY_RESULTS }}
        run: dbt test
